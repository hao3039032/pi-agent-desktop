# Fork: build and publish the distribution (docs/distro.md).
#
# Differences from upstream's release.yml (left untouched so upstream merges
# never conflict): the version is derived from upstream's + distro revision,
# the app is renamed and its updater points at this repository
# (scripts/distro-build-config.mjs), and each platform bundles the
# pre-installed pi packages (distro-seed) — Windows also PortableGit.
name: Publish distro release

on:
  workflow_dispatch:
    inputs:
      macos_arm64_runner:
        description: "Apple Silicon runner (macos-15 selects Xcode 26.3)"
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
      macos_x64_runner:
        description: "Intel build runner (ARM cross-build or native Intel; macos-15 variants select Xcode 26.3)"
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-26-intel
          - macos-15-intel
      prerelease:
        description: "Preview build: keep the release a draft, skip the updater feed and the latest flag"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: distro-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json on the release;
      # parallel jobs would overwrite each other's entries.
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
          - runner: ${{ inputs.macos_arm64_runner || 'macos-26' }}
            platform: macos
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          # Default: cross-compile on Apple Silicon and swap in darwin-x64
          # Node below. The optional *-intel runners build/run x64 natively.
          - runner: ${{ inputs.macos_x64_runner || 'macos-26' }}
            platform: macos
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            apple_signing_identity: "-"
          # Linux stays disabled for now — but not for the old reason. The
          # historical `failed to run linuxdeploy` was never the .relr.dyn /
          # strip issue (tauri#14796): linuxdeploy resolves the dependencies
          # of every ELF inside the resources, and sharp's musl libvips
          # builds (bundled by npm on Linux) need libc.musl-x86_64.so.1,
          # which no glibc system provides. That is fixed —
          # prepare-desktop.mjs drops the musl packages at staging time and a
          # full AppImage bundles cleanly again (verified end to end).
          # What is NOT yet verified is the packaged app on real Linux
          # desktops: on an NVIDIA + sway session GTK's Wayland backend dies
          # with `Error 71 dispatching to Wayland display` (X11 works fine;
          # the unpackaged binary crashes identically, so it is upstream
          # webkit2gtk/GTK, not our bundling). Re-enable once the AppImage
          # has passed smoke tests on a couple of standard distros.
          # - runner: ubuntu-24.04
          #   platform: linux
          #   target: x86_64-unknown-linux-gnu
          #   args: --target x86_64-unknown-linux-gnu --bundles appimage
          #   apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Both macos-15 images default to an older Xcode; select preinstalled
      # Xcode 26.3 explicitly. Missing Xcode fails, never falls back silently.
      - name: Select Xcode 26.3 on macos-15
        if: runner.os == 'macOS' && (matrix.runner == 'macos-15' || matrix.runner == 'macos-15-intel')
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Stage an x86_64 Node runtime for the Intel macOS build
        # The Apple Silicon runner's own Node cannot serve an x86_64 bundle:
        # prepare-desktop.mjs copies PI_DESKTOP_NODE_BINARY instead of the
        # host's process.execPath and refuses a mismatched Mach-O arch.
        # Rosetta (preinstalled, guarded anyway) lets desktop:verify run the
        # x64 server on this runner.
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        shell: bash
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          version="$(node -p process.version)"
          dir="$RUNNER_TEMP/node-$version-darwin-x64"
          mkdir -p "$dir"
          curl -fsSL "https://nodejs.org/dist/$version/node-$version-darwin-x64.tar.gz" \
            | tar xz -C "$dir" --strip-components=1
          test -x "$dir/bin/node"
          {
            echo "PI_DESKTOP_TARGET_TRIPLE=x86_64-apple-darwin"
            echo "PI_DESKTOP_NODE_BINARY=$dir/bin/node"
          } >> "$GITHUB_ENV"

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Configure distro build (version, name, updater endpoint, resources)
        shell: bash
        run: node scripts/distro-build-config.mjs ${{ matrix.platform }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Test artifact rendering and upgrade cache cleanup
        run: node --experimental-strip-types --test lib/artifacts.test.mjs lib/artifact-only-tools.test.mjs components/MarkdownBody.test.mjs components/MessageView.test.mjs scripts/desktop-route-cache.test.mjs

      - name: Write component manifest
        run: npm run release:manifest

      - name: Download the pi CLI for the bundled engine
        # Sessions run on a bundled `pi` child since the route flip. The
        # archive is chosen by the Rust TARGET triple, not the runner: the
        # Intel macOS build cross-compiles on an ARM runner, and the darwin/
        # linux tarballs unpack to `pi/pi` while the Windows zips are flat
        # (`pi.exe`). scripts/pi-cli-release.mjs owns that map, verifies the
        # download against the release's SHA256SUMS, extracts it and exports
        # PI_CLI_SOURCE pointing at a binary named the way
        # resolvePiExecutable() probes for it.
        shell: bash
        run: |
          node scripts/pi-cli-release.mjs \
            --target "${{ matrix.target }}" \
            --download-dir "$RUNNER_TEMP/pi-cli" \
            --github-env "$GITHUB_ENV"

      - name: Prepare packaged Next.js server
        # Every session runs on the bundled pi CLI (route flip); a release
        # without the binary would be dead on arrival, so the gate is hard.
        run: npm run desktop:prepare
        env:
          PI_DESKTOP_REQUIRE_PI: "1"
          PI_CLI_SOURCE: ${{ env.PI_CLI_SOURCE }}
          PI_CLI_DISTRIBUTION_DIR: ${{ env.PI_CLI_DISTRIBUTION_DIR }}

      - name: Verify packaged frontend after an overwrite upgrade
        # Same hard gate as desktop:prepare: a release tree must carry the
        # pi distribution's complete manifest (complete: true).
        run: node scripts/verify-packaged-frontend.mjs
        env:
          PI_DESKTOP_REQUIRE_PI: "1"

      - name: Verify packaged server
        # The verify script is exercised on mac/linux; its Windows path
        # handling is not yet proven (follow-up candidate).
        if: runner.os != 'Windows'
        run: npm run desktop:verify

      - name: Pre-install distro pi packages
        run: npm run distro:seed

      - name: Stage PortableGit (Git Bash)
        if: runner.os == 'Windows'
        run: npm run distro:git

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: Pi Agent LW v__VERSION__${{ inputs.prerelease && ' [PREVIEW]' || '' }}
          releaseBody: |
            Pi Agent LW — pi-agent-desktop with the LW extensions, Git Bash (Windows) and npm built in.

            - Windows: download `*_x64-setup.exe` and run it.
            - macOS (Apple Silicon and Intel): open the `.dmg`, drag the app to Applications. First launch: System Settings → Privacy & Security → "Open Anyway".
            - Linux: temporarily unavailable — AppImage bundling is fixed (sharp's musl libvips was the real cause), but the packaged app needs smoke tests on real Linux desktops before shipping again.

            On first launch, enter the service address and API key. Later changes: Settings → General → Service.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.distro.conf.json

  publish:
    needs: build
    # A preview build stops at the draft: no updater feed rewrite, no
    # --draft=false --latest, so the stable channel never sees it. Review
    # the draft and publish it manually (or discard and rebuild) instead.
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # tauri-action hardcodes every platforms.*.url in latest.json as the
      # release-asset API endpoint (api.github.com/repos/<repo>/releases/
      # assets/<id>), with no input to change it. Networks that block
      # api.github.com while github.com stays reachable then see the update
      # check succeed and the download fail. Rewriting the URLs to github.com
      # download URLs keeps the whole update on github.com; the minisign
      # signatures cover the artifacts, not latest.json, so rewriting the feed
      # cannot forge an update.
      #
      # The rewrite must run before the draft is published, but a draft's
      # assets are served from .../releases/download/untagged-<hash>/... and
      # that path segment only becomes the tag on publish — every untagged-
      # URL 404s afterwards (that is how v0.6.0-rev.1 shipped a broken feed).
      # The script therefore rebuilds each URL with the tag instead of copying
      # the draft's browser_download_url verbatim.
      - name: Rewrite updater JSON download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/distro-build-config.mjs linux)"
          tag="v$version"
          release_id="$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.draft) | select(.tag_name == \"$tag\") | .id")"
          if [ -z "$release_id" ]; then
            echo "::error::no draft release tagged \"$tag\" found; cannot rewrite the updater feed"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/releases/$release_id/assets" > assets.json
          gh release download "$tag" --pattern latest.json --dir updater-dist
          node scripts/rewrite-updater-json.mjs --latest-json updater-dist/latest.json --assets assets.json --repository "${{ github.repository }}" --tag "$tag"
          cd updater-dist
          gh release upload "$tag" latest.json --clobber

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/distro-build-config.mjs linux)"
          gh release edit "v$version" --draft=false --latest

  notify:
    needs: [build, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed release
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Distro release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release stays a **draft**. Do not publish it by hand: a release missing a"
            echo "platform's installer or updater entry will not serve updates to that platform."
          } >> "$GITHUB_STEP_SUMMARY"
