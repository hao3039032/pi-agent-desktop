name: Test the macOS desktop build

# Manual only, and deliberately not part of any release path: it builds the
# macOS app exactly like the release workflow does — same distro config, same
# seed, same signing inputs — but uploads the bundles as workflow artifacts
# instead of creating a release. Use it to iterate on the packaged app (server
# staging, bundled packages, updater behavior) without touching the published
# latest.json; a mac-only release would strand the other platforms' updater
# entries. The target input picks Apple Silicon or Intel (cross-compiled with
# a darwin-x64 Node runtime on the ARM runner).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "macOS architecture to build"
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        default: aarch64-apple-darwin

permissions:
  contents: read

concurrency:
  group: mac-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Stage an x86_64 Node runtime for the Intel macOS build
        # See distro-release.yml: the ARM runner's Node cannot serve an x86_64
        # bundle, so prepare-desktop.mjs copies this one instead.
        if: inputs.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        shell: bash
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          version="$(node -p process.version)"
          dir="$RUNNER_TEMP/node-$version-darwin-x64"
          mkdir -p "$dir"
          curl -fsSL "https://nodejs.org/dist/$version/node-$version-darwin-x64.tar.gz" \
            | tar xz -C "$dir" --strip-components=1
          test -x "$dir/bin/node"
          {
            echo "PI_DESKTOP_TARGET_TRIPLE=x86_64-apple-darwin"
            echo "PI_DESKTOP_NODE_BINARY=$dir/bin/node"
          } >> "$GITHUB_ENV"

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Configure distro build (version, name, updater endpoint, resources)
        run: node scripts/distro-build-config.mjs macos

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install dependencies
        run: npm ci

      - name: Write component manifest
        run: npm run release:manifest

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Pre-install distro pi packages
        run: npm run distro:seed

      # Not tauri-action: no release, no draft, no latest.json — the bundles
      # land in target/release/bundle and are uploaded as artifacts below.
      # PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY must be present while the Rust code
      # compiles: lib.rs registers the updater plugin only when option_env!
      # finds it, and the tauri.conf.json pubkey the earlier step wrote is not
      # read there — without this env var the built app has no updater at all
      # and can never check for updates.
      - name: Build the app (ad-hoc signed)
        env:
          APPLE_SIGNING_IDENTITY: "-"
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          npx tauri build
          --target ${{ inputs.target }}
          --config src-tauri/tauri.distro.conf.json

      - name: Verify the subagent host tree staged completely
        # SDK 1.2.0 dropped `chord` and pi-agent-core's `./node` subpath, so the
        # scope checks the packages it still ships and the core package's entry.
        shell: bash
        run: |
          server_scope="src-tauri/resources/server/node_modules/@earendil-works"
          for pkg in pi-coding-agent pi-agent-core pi-mcp pi-telemetry; do
            test -d "$server_scope/$pkg" || { echo "missing $pkg"; exit 1; }
          done
          test -f "$server_scope/pi-agent-core/dist/index.js"

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: pi-agent-lw-${{ inputs.target }}
          path: |
            src-tauri/target/${{ inputs.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ inputs.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          compression-level: 0
