[package]
name = "session-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "The Rust session host: registry, lifecycle and IPC dispatch over pi-host children"
publish = false

# M2 backbone (plan §五 会话宿主 / §八 M2): one pi child per active session,
# a registry keyed by session id with idle eviction and leases, the
# production spawn shape (session file + bridge asset + nonce), the
# handshake (get_state + get_commands + bridge command attribution), a
# multi-subscriber event fan-out, and the closed-operation dispatch table
# the Tauri `pi_ipc` command routes through. The full session state machine
# (queueing, compaction, steering, fleet monitoring) builds on this crate.

[dependencies]
base64 = "0.22"
pi-host = { path = "../pi-host" }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[features]
# Test-only seams for the deterministic interleaving tests
# (tests/lifecycle.rs): the composer drain barrier
# (`PI_COMPOSER_DRAIN_BARRIER`) and the child kill/lease test hooks. This is
# enabled ONLY through the self dev-dependency below, so `cargo build`
# (and every release/binary build of a dependent, which never sees a
# dev-dependency) does not compile the seam at all — the inherited-env
# barrier can never be armed in a shipped host (Terra round-4).
test-seams = []

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
# The feature gate for this crate's own test seams: the dev-dependency on
# itself turns `test-seams` on for `cargo test` of THIS crate (unit and
# integration builds) while a normal/build dependency (src-tauri) keeps it
# off. See [features].
session-host = { path = ".", features = ["test-seams"] }

[lib]
name = "session_host"
path = "src/lib.rs"
