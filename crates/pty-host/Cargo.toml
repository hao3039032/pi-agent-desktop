[package]
name = "pty-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "Rust portable-pty host for desktop terminals"
publish = false


[dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "pty_host"
path = "src/lib.rs"
